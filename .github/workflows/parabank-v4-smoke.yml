name: ParaBank banking suite

on:
  workflow_dispatch:
  push:
    paths:
      - 'ParabankDemo-v4/**'
      - '.github/workflows/parabank-v4-smoke.yml'
  pull_request:
    paths:
      - 'ParabankDemo-v4/**'
      - '.github/workflows/parabank-v4-smoke.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ParabankDemo-v4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ParabankDemo-v4/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run test:dry-run
      - run: npx playwright install --with-deps chromium
      - run: npm run docker:start
      - name: Wait for ParaBank readiness
        run: curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:8081/parabank/index.htm --output /dev/null
      - name: Run REST API suite (no browser)
        run: npm run test:api -- --format html:reports/cucumber/api-report.html
      - name: Run UI + API smoke suite
        run: npm run test:smoke -- --format html:reports/cucumber/smoke-report.html
      - name: Run regression and security suite
        run: npm run test:regression -- --format html:reports/cucumber/regression-report.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parabank-v4-reports
          path: |
            ParabankDemo-v4/reports/cucumber/*.html
            ParabankDemo-v4/reports/traces/*.zip
          if-no-files-found: warn
